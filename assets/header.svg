      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#203046" stroke-width="1" opacity="0.35"/>
    </pattern>
    <clipPath id="bounds"><rect x="1" y="1" width="1598" height="518" rx="24"/></clipPath>
  </defs>
