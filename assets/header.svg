    <text x="71" y="333" fill="#edf4fc" font-family="DejaVu Sans, sans-serif" font-size="47" letter-spacing="-1">Código começa no problema.</text>
    <text x="74" y="393" fill="#91a5bd" font-family="DejaVu Sans, sans-serif" font-size="25">Backend, dados e processos que precisam funcionar.</text>
    <text x="75" y="451" fill="#5be7ed" font-family="DejaVu Sans Mono, monospace" font-size="17" letter-spacing="1.5">DO DOCUMENTO AO DADO. DO PAPEL AO SISTEMA.</text>
    <rect x="1070" y="112" width="442" height="315" rx="16" fill="#101c2c" stroke="#2b435d" stroke-width="2"/>
