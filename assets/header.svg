    <circle cx="1099" cy="137" r="5" fill="#5be7ed"/>
    <text x="1120" y="144" fill="#a8bacf" font-family="DejaVu Sans Mono, monospace" font-size="17">COM CONTEXTO</text>
    <text x="1100" y="224" fill="#5be7ed" font-family="DejaVu Sans Mono, monospace" font-size="22">01</text>
    <text x="1150" y="224" fill="#e2edf8" font-family="DejaVu Sans Mono, monospace" font-size="26">entender</text>
    <text x="1150" y="252" fill="#8b9fb8" font-family="DejaVu Sans, sans-serif" font-size="17">o processo e as restrições</text>
    <text x="1100" y="296" fill="#5be7ed" font-family="DejaVu Sans Mono, monospace" font-size="22">02</text>
    <text x="1150" y="296" fill="#e2edf8" font-family="DejaVu Sans Mono, monospace" font-size="26">construir</text>
    <text x="1150" y="324" fill="#8b9fb8" font-family="DejaVu Sans, sans-serif" font-size="17">a solução e as integrações</text>
    <text x="1100" y="368" fill="#5be7ed" font-family="DejaVu Sans Mono, monospace" font-size="22">03</text>
    <text x="1150" y="368" fill="#e2edf8" font-family="DejaVu Sans Mono, monospace" font-size="26">validar</text>
    <text x="1150" y="396" fill="#8b9fb8" font-family="DejaVu Sans, sans-serif" font-size="17">o comportamento na prática</text>
