<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Zanga — Código começa no problema.</title>
  <desc id="desc">Cabeçalho em azul escuro e ciano. Software, automação e IA aplicada. Entender, construir e validar.</desc>
  <defs>
